# Fixa a versao da API do Docker usada pelo cliente nos testes de integracao.
#
# Por que este arquivo existe:
#
# O Docker Engine 29 elevou a versao minima de API aceita para 1.40 e recusa
# com HTTP 400 qualquer cliente abaixo disso. O Testcontainers 1.x embute um
# docker-java que, quando nao consegue negociar uma versao maior, assume 1.32
# como padrao -- abaixo do piso do daemon. O resultado e a mensagem enganosa
# "Could not find a valid Docker environment", que parece ausencia de Docker
# mas na verdade e o daemon respondendo "client version 1.32 is too old".
#
# 1.44 esta dentro da faixa aceita pelo Docker 29 e cobre tudo que o
# Testcontainers precisa. O arquivo e lido pelo docker-java a partir da raiz
# do classpath, e por estar em src/test/resources vale apenas para os testes:
# a aplicacao em si nao fala com o Docker.
#
# Este arquivo e versionado de proposito, para que o build seja reproduzivel
# em qualquer maquina com Docker 29 -- e nao dependa de variavel de ambiente
# configurada a mao.
#
# Quando remover: ao subir o Testcontainers para 2.0.2 ou superior, que
# negocia a versao da API corretamente. Ai esta linha vira ruido.

api.version=1.44
